name: Verify employment terms 1159

# Branch-only verification lets #1374 stay draft without changing the normal PR policy.
on:
  push:
    branches:
      - ai/1159-employment-terms-calendar-boundaries

permissions:
  contents: read

concurrency:
  group: employment-terms-1159-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  unit:
    name: Employment terms unit tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install webapp dependencies
        run: pnpm --filter webapp... install --frozen-lockfile
      - name: Run full webapp unit shard
        run: pnpm --filter webapp test --shard=${{ matrix.shard }}/2

  static:
    name: Employment terms typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install webapp dependencies
        run: pnpm --filter webapp... install --frozen-lockfile
      - name: Generate translation metadata
        run: pnpm --filter webapp i18n:metadata
      - name: Generate license metadata
        run: pnpm --filter webapp generate-licenses
      - name: Typecheck
        run: pnpm --filter webapp typecheck
      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm --filter webapp build

  biome:
    name: Employment terms changed-file Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install webapp dependencies
        run: pnpm --filter webapp... install --frozen-lockfile
      - name: Check changed TypeScript files
        working-directory: apps/webapp
        run: >-
          pnpm exec biome ci --max-diagnostics=100
          "src/app/[locale]/(app)/cache-components-route-contract.test.ts"
          "src/app/[locale]/onboarding/organization/page.tsx"
          "src/app/[locale]/onboarding/organization/page.server.test.tsx"
          src/app/api/driving-licence/evidence/route.ts
          src/lib/calendar/employment-terms-requirements.integration.test.ts
          src/lib/calendar/work-policy-requirements.test.ts
          src/lib/calendar/work-policy-requirements.ts
          src/lib/employment-history/load-terms-in-force.ts
          src/lib/scheduling/staffing/load-staffing-facts.ts

  postgres:
    name: Employment terms PostgreSQL regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install webapp dependencies
        run: pnpm --filter webapp... install --frozen-lockfile
      - name: Generate translation metadata
        run: pnpm --filter webapp i18n:metadata
      - name: Run affected PostgreSQL suites
        run: |
          set -euo pipefail
          database_name="approval_workflow_repository_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          PGPASSWORD=postgres psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres \
            --command "create database \"${database_name}\""
          bash apps/webapp/scripts/run-postgres-integration-suites.sh \
            "postgresql://postgres:postgres@127.0.0.1:5432/${database_name}" \
            src/lib/calendar/employment-terms-requirements.integration.test.ts \
            src/lib/calendar/work-policy-requirements.integration.test.ts \
            src/lib/employment-history/load-terms-in-force.integration.test.ts \
            src/lib/effect/services/__tests__/staffing-suggestion.service.integration.test.ts
