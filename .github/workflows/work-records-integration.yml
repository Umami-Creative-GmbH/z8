name: Work records PostgreSQL

# Runs the PostgreSQL suites that guard work records, the only writer of completed
# work (#1212), on PRs into dev. It is independent of POSTGRES_INTEGRATION_TESTS_ENABLED,
# which turns off only the full PostgreSQL job of tests.yml (#1208). The suites are
# selected by path pattern in .github/scripts/work-records-suites.mjs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - dev
    paths:
      - "apps/webapp/**"
      - "!**/*.md"
      - "!apps/webapp/messages/**"
      - "!apps/webapp/public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/scripts/work-records-suites.mjs"
      - ".github/workflows/work-records-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-records-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  work-records:
    name: Work records PostgreSQL suites
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pull the official image directly; the ECR public mirror can exhaust its data quota.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Keep PostgreSQL durability settings; only the disposable storage moves to RAM.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install web-app dependencies
        run: pnpm --filter webapp... install --frozen-lockfile
      - name: Restore Vitest transforms
        id: vitest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/webapp-vitest-cache
          key: webapp-vitest-${{ runner.os }}-node26-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/webapp/*config*') }}-work-records-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            webapp-vitest-${{ runner.os }}-node26-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/webapp/*config*') }}-work-records-
      - name: Prepare transform cache directory
        run: mkdir -p "$RUNNER_TEMP/webapp-vitest-cache"
      - name: Run work records PostgreSQL suites
        id: test-run
        run: |
          set -euo pipefail
          suites="$(node .github/scripts/work-records-suites.mjs)"
          mapfile -t suite_paths <<< "$suites"
          printf 'Selected suites:\n%s\n' "$suites"
          database_name="approval_workflow_repository_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          PGPASSWORD=postgres psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres \
            --command "create database \"${database_name}\""
          bash apps/webapp/scripts/run-postgres-integration-suites.sh \
            "postgresql://postgres:postgres@127.0.0.1:5432/${database_name}" "${suite_paths[@]}" --fsModuleCache --fsModuleCachePath="$RUNNER_TEMP/webapp-vitest-cache"
      - name: Save Vitest transforms
        if: ${{ always() && (steps.test-run.outcome == 'success' || steps.test-run.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/webapp-vitest-cache
          key: ${{ steps.vitest-cache.outputs.cache-primary-key }}
