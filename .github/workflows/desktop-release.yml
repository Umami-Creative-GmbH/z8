name: Desktop signed release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the desktop package and desktop-vVERSION tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed:
    # Provision this isolated runner with the organization's hardware or managed
    # signing provider. Never execute pull request code on this runner.
    runs-on: [self-hosted, Windows, X64, z8-desktop-signing]
    environment: desktop-release
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      Z8_DESKTOP_UPDATE_ENDPOINT: ${{ vars.Z8_DESKTOP_UPDATE_ENDPOINT }}
      Z8_DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.Z8_DESKTOP_UPDATE_PUBLIC_KEY }}
      Z8_DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.Z8_DESKTOP_DOWNLOAD_BASE_URL }}
      Z8_WINDOWS_SIGN_COMMAND: ${{ vars.Z8_WINDOWS_SIGN_COMMAND }}
      Z8_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.Z8_WINDOWS_SIGNER_THUMBPRINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: desktop-v${{ inputs.version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: pnpm --filter desktop install --frozen-lockfile
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop exec node scripts/prepare-release.mjs
      - run: pnpm --filter desktop tauri build --config .release/tauri.release.json --bundles "nsis,msi"
      - name: Verify publisher signatures
        shell: pwsh
        run: |
          $expectedSigner = $env:Z8_WINDOWS_SIGNER_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          $files = Get-ChildItem apps/desktop/src-tauri/target/release -File -Filter '*.exe'
          $files += Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedSigner) {
              throw "Publisher signature verification failed: $($file.Name)"
            }
          }
      - run: pnpm --filter desktop exec node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-${{ inputs.version }}-signed-candidate
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error