name: Desktop Windows
on:
  pull_request:
    branches: [dev, main]
    paths: ['apps/desktop/**', 'apps/webapp/src/app/api/desktop/**', 'pnpm-lock.yaml', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --filter desktop install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-windows-unsigned-review-only
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error