name: Warm base pnpm caches
on:
  push:
    branches: [dev]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - '.github/workflows/ci-cache-warm.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-base-pnpm-warm
  cancel-in-progress: true
jobs:
  pnpm:
    # Never execute a PR ref or an arbitrary dispatch ref to populate trusted caches.
    if: github.ref == 'refs/heads/dev'
    name: Warm pnpm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: node
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Populate only missing dependency stores
        if: steps.node.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            pnpm --filter desktop install --frozen-lockfile
          } else {
            pnpm install --frozen-lockfile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report cache warming
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: |
          "pnpm base cache: OS=$env:RUNNER_OS, exact hit=$env:CACHE_HIT, lockfile=pnpm-lock.yaml" >> $env:GITHUB_STEP_SUMMARY
