name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    # React Doctor only analyzes component and hook source; tests and non-TS files cannot change its findings.
    paths:
      - "apps/webapp/**/*.ts"
      - "apps/webapp/**/*.tsx"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
      - ".github/workflows/react-doctor.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    # Drafts are reviewed once they are marked ready (ready_for_review trigger).
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run React Doctor
        uses: millionco/react-doctor@v2
        with:
          directory: apps/webapp
          # Keep the release gate on the web app even if workspace discovery changes.
          project: webapp
          blocking: error
          # The job check already reports the result; avoid a duplicate status
          # that requires an additional statuses: write permission.
          commit-status: false
          # Findings are listed in the sticky summary comment. Inline comments
          # re-post every warning after each push to dev and bury the release PR.
          review-comments: false
