name: Debounce expensive PR jobs
on:
  workflow_call:
permissions:
  contents: read
jobs:
  wait:
    name: Wait for a stable PR update
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Debounce PR updates before allocating expensive runners
        if: github.event_name == 'pull_request'
        run: sleep 90
