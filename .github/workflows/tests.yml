name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/scripts/**"
      - "docker/Dockerfile.*"
      - "docker/targets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          set +e
          pnpm test
          status=$?

          {
            echo "## Test Results"
            echo ""
            echo "Command: \`pnpm test\`"
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Result: passed"
            else
              echo "Result: failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

           exit "$status"

      - name: Run approval workflow repository PostgreSQL integration contract
        run: |
          set -euo pipefail
          database_name="approval_workflow_repository_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          export PGPASSWORD=postgres
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres \
            --command "create database \"${database_name}\""

          export POSTGRES_HOST=127.0.0.1
          export POSTGRES_PORT=5432
          export POSTGRES_DB="$database_name"
          export POSTGRES_USER=postgres
          export POSTGRES_PASSWORD=postgres
          export POSTGRES_SSL_MODE=disable
          SKIP_ENV_VALIDATION=1 \
          APPROVAL_WORKFLOW_REPOSITORY_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/${database_name}" \
          APPROVAL_WORKFLOW_REPOSITORY_TEST_SENTINEL=approval-workflow-repository-test \
          pnpm --filter webapp exec tsx scripts/verify-approval-migration-recovery.ts

          APPROVAL_WORKFLOW_REPOSITORY_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/${database_name}" \
          APPROVAL_WORKFLOW_REPOSITORY_TEST_SENTINEL=approval-workflow-repository-test \
          APPROVAL_WORKFLOW_REPOSITORY_TEST_REQUIRED=1 \
          pnpm --filter webapp exec vitest run src/lib/approvals/workflow/repository.integration.test.ts \
            src/lib/approvals/workflow/transition-engine.integration.test.ts \
            src/lib/approvals/server/time-correction-approvals.integration.test.ts \
            src/lib/approvals/server/work-period-approvals.integration.test.ts
