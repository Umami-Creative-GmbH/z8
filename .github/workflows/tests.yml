name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/scripts/**"
      - "docker/Dockerfile.*"
      - "docker/targets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker runtime tests
        if: matrix.shard == 1
        run: pnpm node --test docker/scripts/prepare-target-runtime.test.mjs

      - name: Run test shard
        run: pnpm exec turbo test --filter=webapp --output-logs=full --log-order=stream -- --shard=${{ matrix.shard }}/4

      - name: Run other workspace tests
        if: matrix.shard == 1
        run: pnpm exec turbo test --filter='!webapp' --output-logs=full --log-order=stream

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run approval workflow repository PostgreSQL integration contract
        run: |
          set -euo pipefail
          database_name="approval_workflow_repository_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          export PGPASSWORD=postgres
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres \
            --command "create database \"${database_name}\""

          export POSTGRES_HOST=127.0.0.1
          export POSTGRES_PORT=5432
          export POSTGRES_DB="$database_name"
          export POSTGRES_USER=postgres
          export POSTGRES_PASSWORD=postgres
          export POSTGRES_SSL_MODE=disable
          SKIP_ENV_VALIDATION=1 \
          APPROVAL_WORKFLOW_REPOSITORY_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/${database_name}" \
          APPROVAL_WORKFLOW_REPOSITORY_TEST_SENTINEL=approval-workflow-repository-test \
          pnpm --filter webapp exec tsx scripts/verify-approval-migration-recovery.ts

           APPROVAL_WORKFLOW_REPOSITORY_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/${database_name}" \
           APPROVAL_WORKFLOW_REPOSITORY_TEST_SENTINEL=approval-workflow-repository-test \
           APPROVAL_WORKFLOW_REPOSITORY_TEST_REQUIRED=1 \
           TZ=UTC \
           PGOPTIONS="-c statement_timeout=15000 -c timezone=UTC" \
           pnpm --filter webapp exec vitest run --no-file-parallelism src/lib/scim/scim-callback-atomicity.integration.test.ts \
            src/lib/scim/seat-sync-outbox.integration.test.ts \
            src/lib/scim/protocol.integration.test.ts \
            src/lib/approvals/workflow/repository.integration.test.ts \
            src/lib/approvals/workflow/transition-engine.integration.test.ts \
            src/lib/approvals/server/time-correction-approvals.integration.test.ts \
            src/lib/approvals/server/work-period-approvals.integration.test.ts \
            "src/app/[locale]/(app)/time-tracking/actions/clocking.web-clock-in.integration.test.ts" \
            "src/app/[locale]/(app)/time-tracking/actions/clocking.web-clock-out.integration.test.ts" \
            "src/app/[locale]/(app)/time-tracking/actions/clocking.web-clock-out-operation.integration.test.ts" \
            src/lib/import-review/reviewed-import-operation.integration.test.ts \
            "src/app/[locale]/(app)/time-tracking/actions/clocking.approval-evidence.integration.test.ts" \
            src/lib/demo/demo-work.integration.test.ts \
            src/lib/bot-platform/clock-commands.integration.test.ts \
            src/app/api/time-entries/offline-context/route.integration.test.ts \
            src/app/api/time-entries/commands/route.integration.test.ts \
            src/lib/time-tracking/append-assurance.integration.test.ts \
            src/lib/cron/legacy-escalation-fencing.integration.test.ts \
            src/lib/approvals/presentation/review-arrival.integration.test.ts \
            src/lib/telegram/bound-approval.integration.test.ts \
            src/lib/approvals/delivery/telegram-delivery.integration.test.ts \
            src/lib/approvals/delivery/slack-delivery.integration.test.ts

  tests:
    # Preserve the required check name and fail if any shard/integration job fails or skips.
    name: Tests
    if: always()
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check test results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        run: |
          echo "Unit test shards: $UNIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "PostgreSQL integration: $INTEGRATION_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
