name: CI storage maintenance
on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: [Desktop Windows]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible entries (false reports a dry run)
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ci-storage-maintenance
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Never checkout producer/PR code or download artifacts in this privileged job.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify cleanup safety rules
        run: node --test .github/scripts/ci-maintenance.test.mjs .github/scripts/github-api.test.mjs
      - name: Reconcile CI storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          if [[ "$APPLY" == true ]]; then
            node .github/scripts/ci-maintenance.mjs --apply
          else
            node .github/scripts/ci-maintenance.mjs --dry-run
          fi
