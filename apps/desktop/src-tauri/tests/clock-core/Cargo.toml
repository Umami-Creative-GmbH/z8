[package]
name = "z8-desktop-clock-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[features]
desktop-recovery-evidence = []

# Compile the real storage/HTTP modules without the native windowing libraries.
[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
parking_lot = "0.13"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
url = "2"
base64 = "0.23"
rand = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
