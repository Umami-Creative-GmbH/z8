overrides:
  # Keep React types aligned across workspace packages.
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # Patch legacy esbuild-kit and retain desktop Safari-target build compatibility.
  esbuild: 0.25.12
  # React PDF relies on pako's internal lib/zlib paths.
  pako: 1.0.11
  # ExcelJS and BotBuilder still request versions affected by GHSA-w5hq-g745-h8pq.
  uuid: 14.0.3

patchedDependencies:
#  drizzle-kit@0.31.11: patches/drizzle-kit@0.31.11.patch
#  next@16.4.3: patches/next@16.4.3.patch
#  next@16.4.6: patches/next@16.4.6.patch

permissions:
  "@tanstack/react-hotkeys":
    skills: true
  "@tanstack/react-table":
    skills: [getting-started, migrate-v8-to-v9, table-state]

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
