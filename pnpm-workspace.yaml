packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  '@swc/core': true
  core-js: false
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.15'
  - '@turbo/darwin-arm64@2.9.15'
  - '@turbo/linux-64@2.9.15'
  - '@turbo/linux-arm64@2.9.15'
  - '@turbo/windows-64@2.9.15'
  - '@turbo/windows-arm64@2.9.15'
  - turbo@2.9.15
  - tmp@0.2.6
  - oxlint-plugin-react-doctor@0.5.1
  - react-doctor@0.5.1
  - bullmq@6.0.7
  - '@better-auth/api-key@1.7.2'
  - '@better-auth/core@1.7.2'
  - '@better-auth/drizzle-adapter@1.7.2'
  - '@better-auth/kysely-adapter@1.7.2'
  - '@better-auth/memory-adapter@1.7.2'
  - '@better-auth/mongo-adapter@1.7.2'
  - '@better-auth/passkey@1.7.2'
  - '@better-auth/prisma-adapter@1.7.2'
  - '@better-auth/scim@1.7.2'
  - '@better-auth/sso@1.7.2'
  - '@better-auth/telemetry@1.7.2'
  - better-auth@1.7.2

overrides:
  # Keep React types aligned across workspace packages.
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  # Patch legacy esbuild-kit and retain desktop Safari-target build compatibility.
  esbuild: 0.25.12
  # React PDF relies on pako's internal lib/zlib paths.
  pako: 1.0.11
  # ExcelJS and BotBuilder still request versions affected by GHSA-w5hq-g745-h8pq.
  uuid: 14.0.0
